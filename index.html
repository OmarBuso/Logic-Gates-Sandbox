<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Logic Gates Sandbox</title>
    <!--
      I lied to myself. I said "this will just be a quick weekend project to understand XOR with Tetris"
      Now I'm staring at CSS overrides that I'm too afraid to consolidate because CSS is black magic and I value my sanity
      Yes, some of it is copy-pasted between the media query and the data-theme
      I tried to fix it once
      The layout broke (and still breaks) on iOS
      We don't touch the 8 lines anymore
    -->
    <link rel="stylesheet" href="styles.css">
</head>

<body data-m="view">
    <header><b id="appTitle">Logic Gates Sandbox</b><button id="bLab" class="on" title="Show labels">Aa</button><button id="bUndo" class="iconbtn" title="Undo">←</button><button id="bRedo" class="iconbtn" title="Redo">→</button><button id="bMenu">⋮</button></header>
    <main><canvas id="cv"></canvas>
        <div><div id="toast"></div></div>
        <div id="tutBox" hidden></div>
        <div id="menu" hidden><button data-m="abs">Abstract board</button><button data-m="cancelEdit" id="cancelEdit" hidden>Cancel definition edit</button><button data-m="io">Import / Export</button><button data-m="probe" id="bProbeMenu">Truth tables: off</button><button data-m="examples">Example boards</button><button data-m="set">Settings</button><button data-m="clr">Clear board</button></div>
    </main>
    <section id="sheet" hidden></section>
    <footer><button id="bMode">Build</button>
        <div id="pal"></div>
    </footer>
    <div id="modal" hidden></div>
    <script src="script.js"></script>
</body>
</html>
